[project]
name = "lfs-stripe"
version = "1.0.3"
description = "Stripe payments for LFS"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kai Diefenbach" }]
requires-python = ">=3.12"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django-lfs>=1.0,<2",
    "stripe>=15.6,<16",
]

[project.urls]
Source = "https://github.com/diefenbach/lfs-stripe"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Allowlist, because hatchling ignores the global ~/.gitignore that keeps recaps/, todos/ etc. out of git.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests"]
